<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Sign Up - StudentAI
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="auth-body">


<div class="auth-container">


    <div class="auth-card signup-card">


        <div class="auth-logo">
            🎓
        </div>


        <h1>
            Create Account
        </h1>


        <p class="auth-subtitle">
            Register as a student
        </p>


        {% if error %}

        <div class="error-message">

            {{ error }}

        </div>

        {% endif %}


        <form method="POST"
              action="/signup">


            <!-- NAME -->

            <div class="input-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- COLLEGE -->

            <div class="input-group">

                <label>
                    College Name
                </label>

                <input
                    type="text"
                    name="college_name"
                    placeholder="Enter your college name"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label>
                    Re-enter Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >

                Create Account

            </button>


        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>


    </div>


</div>


</body>

</html>
